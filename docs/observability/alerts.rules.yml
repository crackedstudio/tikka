groups:
  - name: tikka-indexer-alerts
    rules:
      - alert: IndexerFallingBehind
        expr: tikka_indexer_lag_ledgers > 20
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Indexer is lagging behind the Stellar network"
          description: "The indexer is currently {{ $value }} ledgers behind the Horizon tip. This has persisted for more than 5 minutes."
      - alert: IndexerLedgerLagHigh
        expr: indexer_ledger_lag > 100
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Indexer ledger lag is too high"
          description: "The indexer is currently {{ $value }} ledgers behind the Stellar network tip. This has persisted for more than 5 minutes."

      - alert: IndexerHighLatency
        expr: rate(tikka_indexer_poll_duration_seconds_sum[5m]) / rate(tikka_indexer_poll_duration_seconds_count[5m]) > 10
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "High polling latency detected"
          description: "The average poll duration is {{ $value }}s, which is above the threshold of 10s."

      - alert: IndexerErrors
        expr: rate(tikka_indexer_errors_total[5m]) > 0.1
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Indexer encountering errors"
          description: "The indexer is encountering errors at a rate of {{ $value }} per second."

  - name: tikka-oracle-alerts
    rules:
      - alert: OracleStuckDrawAboveThreshold
        expr: tikka_oracle_stuck_draws_total > 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Oracle has {{ $value }} stuck draws that may need rescue"
          description: "At least one raffle draw has been stuck for longer than the configured threshold (ledger lag or queue age). Stuck count: {{ $value }}."
          runbook_url: "https://github.com/crackedstudio/tikka/blob/main/docs/runbooks/oracle-stuck-draw.md"

      - alert: OracleStuckDrawMaxAgeCritical
        expr: tikka_oracle_stuck_draw_max_age_seconds > 600
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Oldest stuck draw exceeded 10 minutes"
          description: "The oldest stuck draw is {{ $value | humanizeDuration }} old. Immediate rescue likely required."
          runbook_url: "https://github.com/crackedstudio/tikka/blob/main/docs/runbooks/oracle-stuck-draw.md"

      - alert: OracleStuckDrawMaxAgeWarning
        expr: tikka_oracle_stuck_draw_max_age_seconds > 300
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Oldest stuck draw exceeded 5 minutes"
          description: "The oldest stuck draw is {{ $value | humanizeDuration }} old. Investigate before the situation escalates."
          runbook_url: "https://github.com/crackedstudio/tikka/blob/main/docs/runbooks/oracle-stuck-draw.md"