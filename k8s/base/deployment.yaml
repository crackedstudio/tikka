# Shared Deployment structure for every Tikka service (#1476).
#
# Everything here is deliberately service-agnostic: replica count, rollout
# strategy, grace period, security context, resource envelope, and the probe
# *timings*. Overlays in <service>/k8s/ supply the name, image, port, and probe
# paths. Nothing service-specific belongs in this file — if it differs per
# service, it goes in the overlay.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tikka
  labels:
    app: tikka
spec:
  replicas: 2
  selector:
    matchLabels:
      app: tikka
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: tikka
    spec:
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: app
          image: ghcr.io/crackedstudio/tikka-service:latest
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          # Startup gates the other two: up to 150s (30 x 5s) to boot before
          # anything is declared failed.
          startupProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 0
            periodSeconds: 5
            failureThreshold: 30
            timeoutSeconds: 3
          # Readiness controls traffic. Overlays point it at whichever path
          # reports "safe to serve" — a degraded dependency must fail this.
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 3
            timeoutSeconds: 5
          # Liveness restarts the pod. Overlays point it at a path that only
          # fails when the process itself is wedged — never at a dependency
          # check, or a slow database will restart-loop the fleet.
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 3
            timeoutSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
