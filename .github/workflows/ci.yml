name: CI

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Detect whether any source files changed.
  # Docs-only PRs (changes only inside docs/) skip the turbo job entirely.
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      source: ${{ steps.filter.outputs.source }}
      client: ${{ steps.filter.outputs.client }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            source:
              - 'client/**'
              - 'sdk/**'
              - 'backend/**'
              - 'indexer/**'
              - 'oracle/**'
              - 'package.json'
              - 'pnpm-workspace.yaml'
              - 'turbo.json'
              - '.github/workflows/ci.yml'
            client:
              - 'client/**'
              - 'sdk/**'
              - 'package.json'
              - 'pnpm-workspace.yaml'
              - 'turbo.json'
              - '.github/workflows/ci.yml'

  # Single Turborepo job: lint → test → build (typecheck) across all packages.
  # Turbo's task graph ensures sdk builds before anything that depends on it,
  # and its local cache means an unchanged package's tasks are served from cache.
  turbo:
    name: Turbo — lint, test, typecheck, build
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.source == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          version: 8

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache Turborepo
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-

      - name: Lint (all packages)
        run: pnpm exec turbo run lint

      - name: Typecheck (all packages)
        run: pnpm exec turbo run typecheck

      - name: Test (all packages)
        run: pnpm exec turbo run test
        env:
          NODE_ENV: test

      - name: Build (all packages)
        run: pnpm exec turbo run build

      - name: Upload client build artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: client-build
          path: client/dist
          retention-days: 7

      - name: Upload sdk build artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: sdk-build
          path: sdk/dist
          retention-days: 7

      - name: Upload backend build artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: backend-build
          path: backend/dist
          retention-days: 7

      - name: Upload indexer build artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: indexer-build
          path: indexer/dist
          retention-days: 7

      - name: Upload oracle build artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: oracle-build
          path: oracle/dist
          retention-days: 7

  # Secret scanning - blocks PRs that contain verified secrets
  security-scan:
    name: Secret Scanning (TruffleHog)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Run TruffleHog secret scan
        uses: trufflesecurity/trufflehog@6f3c981e7b77f235fd2702dd74af25fc4b72bf11 # main
        with:
          path: ./
          base: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          head: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.event.after }}
          extra_args: >-
            --only-verified
            --exclude-paths .trufflehog-exclude

  # Lighthouse CI for client performance budgets
  lighthouse:
    name: Lighthouse CI - Performance Budgets
    runs-on: ubuntu-latest
    needs: turbo
    if: needs.turbo.result == 'success'
    defaults:
      run:
        working-directory: ./client
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          version: 8

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: client/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: client-build
          path: client/dist

      - name: Run Lighthouse CI
        run: |
          pnpm exec lhci autorun
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}

      - name: Upload Lighthouse results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: lighthouse-results
          path: |
            client/.lighthouseci
          retention-days: 30

      - name: Comment PR with Lighthouse results
        if: github.event_name == 'pull_request'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            // Read the Lighthouse results
            const resultsPath = path.join(process.cwd(), 'client/.lighthouseci');

            if (!fs.existsSync(resultsPath)) {
              console.log('No Lighthouse results found');
              return;
            }

            // Find the manifest file
            const files = fs.readdirSync(resultsPath);
            const manifestFile = files.find(f => f.includes('manifest.json'));

            if (!manifestFile) {
              console.log('No manifest file found');
              return;
            }

            const manifest = JSON.parse(
              fs.readFileSync(path.join(resultsPath, manifestFile), 'utf8')
            );

            // Get the first result
            const result = manifest[0];
            const summary = result.summary;

            // Create comment body
            const comment = `## 🔦 Lighthouse CI Results

            Performance metrics for this build:

            | Metric | Score | Status |
            |--------|-------|--------|
            | 🎨 Performance | ${Math.round(summary.performance * 100)} | ${summary.performance >= 0.9 ? '✅' : '⚠️'} |
            | ♿ Accessibility | ${Math.round(summary.accessibility * 100)} | ${summary.accessibility >= 0.9 ? '✅' : '⚠️'} |
            | 🎯 Best Practices | ${Math.round(summary['best-practices'] * 100)} | ${summary['best-practices'] >= 0.9 ? '✅' : '⚠️'} |
            | 🔍 SEO | ${Math.round(summary.seo * 100)} | ${summary.seo >= 0.9 ? '✅' : '⚠️'} |

            [📊 View full Lighthouse report](${result.url})

            ### Core Web Vitals
            - **LCP (Largest Contentful Paint)**: Target < 2.5s
            - **CLS (Cumulative Layout Shift)**: Target < 0.1
            - **FCP (First Contentful Paint)**: Target < 2.0s
            `;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });

  # Commit message linting - ensures commit messages follow conventional commits format
  commitlint:
    name: Commit Message Linting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          version: 8

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate PR commits with commitlint
        if: github.event_name == 'pull_request'
        run: pnpm exec commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }}

      - name: Validate last commit on push
        if: github.event_name == 'push'
        run: pnpm exec commitlint --from HEAD~1 --to HEAD

  # Summary job - fails if any required job fails
  ci-summary:
    name: CI Summary
    runs-on: ubuntu-latest
    needs: [commitlint, turbo, security-scan, lighthouse]
    if: always()
    steps:
      - name: Check all jobs status
        run: |
          check_status() {
            if [[ "$1" != "success" && "$1" != "skipped" ]]; then
              return 1
            fi
            return 0
          }

          if ! check_status "${{ needs.commitlint.result }}" || \
             ! check_status "${{ needs.turbo.result }}" || \
             ! check_status "${{ needs.security-scan.result }}" || \
             ! check_status "${{ needs.lighthouse.result }}"; then
            echo "❌ One or more CI checks failed"
            exit 1
          fi
          echo "✅ All CI checks passed"
