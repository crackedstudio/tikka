name: Indexer Mainnet Reconciliation

on:
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:

concurrency:
  group: indexer-mainnet-reconciliation
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  reconcile:
    name: Reconcile indexed state against Stellar mainnet
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: ${{ secrets.INDEXER_DATABASE_URL }}
      SOROBAN_RPC_URL: https://soroban.stellar.org
      TIKKA_CONTRACT_ID: ${{ secrets.TIKKA_CONTRACT_MAINNET }}
      TIKKA_CONTRACT_MAINNET: ${{ secrets.TIKKA_CONTRACT_MAINNET }}
      RECONCILIATION_SAMPLE_SIZE: '25'
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          version: 9.15.9

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build read-only SDK
        run: pnpm --filter @tikka/sdk build

      - name: Reconcile indexed state
        run: pnpm --filter tikka-indexer reconcile
