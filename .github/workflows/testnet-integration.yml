name: SDK Testnet Integration (Nightly)

on:
  schedule:
    # Runs daily at 03:00 UTC
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for manual trigger'
        required: false
        default: 'Manual testnet integration trigger'
      fee_tolerance_percent:
        description: 'Fee accuracy tolerance (%) for the estimate-vs-actual check'
        required: false
        default: '15'
      surge_tolerance_percent:
        description: 'Fee accuracy tolerance (%) while the network is surged'
        required: false
        default: '100'
      surge_threshold_stroops:
        description: 'Inclusion fee (stroops) at or above which the network counts as surged'
        required: false
        default: '1000'

concurrency:
  group: sdk-testnet-integration
  cancel-in-progress: true

env:
  FEE_REPORT_JSON: ${{ github.workspace }}/sdk/fee-accuracy-report.json
  FEE_REPORT_MARKDOWN: ${{ github.workspace }}/sdk/fee-accuracy-report.md

jobs:
  testnet-integration:
    name: SDK Testnet Round-Trip Suite
    runs-on: ubuntu-latest
    timeout-minutes: 30

    defaults:
      run:
        working-directory: ./sdk

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          version: 8

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Testnet Integration Suite
        env:
          TIKKA_TESTNET_TESTS: '1'
          TIKKA_TESTNET_SECRET_KEY: ${{ secrets.TIKKA_TESTNET_SECRET_KEY }}
          TIKKA_CONTRACT_TESTNET: ${{ secrets.TIKKA_CONTRACT_TESTNET }}
        run: pnpm run test:integration

      # Submits real transactions and compares the fee the SDK quoted against
      # the fee the network charged, within the tolerance configured below.
      - name: Run Fee Accuracy Suite
        env:
          TIKKA_TESTNET_TESTS: '1'
          TIKKA_FEE_ACCURACY_TESTS: '1'
          TIKKA_TESTNET_SECRET_KEY: ${{ secrets.TIKKA_TESTNET_SECRET_KEY }}
          TIKKA_CONTRACT_TESTNET: ${{ secrets.TIKKA_CONTRACT_TESTNET }}
          TIKKA_FEE_REPORT_PATH: fee-accuracy-report.json
          TIKKA_FEE_ACCURACY_TOLERANCE_PERCENT: ${{ inputs.fee_tolerance_percent || '15' }}
          TIKKA_FEE_ACCURACY_SURGE_TOLERANCE_PERCENT: ${{ inputs.surge_tolerance_percent || '100' }}
          TIKKA_FEE_ACCURACY_SURGE_THRESHOLD_STROOPS: ${{ inputs.surge_threshold_stroops || '1000' }}
        run: pnpm run test:fee-accuracy

      # Fails the run when any observation drifted outside the tolerance band,
      # or when the suite recorded no observations at all.
      - name: Enforce fee accuracy tolerance
        if: always()
        run: pnpm --filter @tikka/fee-accuracy run gate -- --path "$FEE_REPORT_JSON"

      - name: Upload fee accuracy report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: sdk-fee-accuracy-report
          path: |
            sdk/fee-accuracy-report.json
            sdk/fee-accuracy-report.md
          if-no-files-found: warn
          retention-days: 14

      - name: Report job summary
        if: always()
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          ## 🧪 SDK Testnet Integration Suite Report

          | Field | Value |
          | --- | --- |
          | **Status** | ${{ job.status }} |
          | **Run at** | $(date -u) |
          | **Trigger** | \`${{ github.event_name }}\` |
          EOF

          if [ -f "$FEE_REPORT_MARKDOWN" ]; then
            {
              echo ""
              echo "### Fee estimate accuracy"
              echo ""
              cat "$FEE_REPORT_MARKDOWN"
            } >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo ""
              echo "### Fee estimate accuracy"
              echo ""
              echo "No report was produced — the fee accuracy suite did not complete."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
